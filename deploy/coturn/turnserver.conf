# coturn configuration for an RDA relay PoP.
#
# The one setting that has to match the signaling server is `use-auth-secret` with the same
# `static-auth-secret`. That is the whole credential story: the server mints
# `username = "<unix-expiry>:<session-id>"` and `credential = base64(HMAC-SHA1(secret, username))`,
# and coturn verifies it with no per-user database and no shared state
# (docs/PROTOCOL.md §3.3). Rotating the secret invalidates every outstanding credential, which is
# the intended behaviour in an incident.
#
# Credentials are supplied at runtime by docker-compose so the secret is never written to disk in
# this file.

# --- listeners --------------------------------------------------------------------------------

listening-port=3478
tls-listening-port=5349

# UDP first, always. TURN over TCP or TLS adds head-of-line blocking to a media stream that is
# explicitly designed to tolerate loss rather than wait for retransmission — on a 220 ms path that
# trade is strictly bad. The TLS listener exists only for networks that block UDP outright.
# `no-multicast-peers` and the denied-peer ranges below are what stop the relay being used to reach
# anything but the public internet.

fingerprint
use-auth-secret

# --- relay behaviour --------------------------------------------------------------------------

# The range the relay allocates from. Must be open in the host firewall and the cloud security
# group; a closed range produces allocations that succeed and then carry nothing.
min-port=49152
max-port=65535

# Sessions are long-lived and mostly idle at the TURN layer, because media flows without any TURN
# involvement once a channel is bound. A short lifetime would tear down working sessions.
stale-nonce=600

# ChannelData framing costs 4 bytes of overhead per packet against 36 for a full STUN Send
# indication. On a relayed 4 Mbps stream that is roughly 100 kbps saved, which on this corridor is
# not a rounding error.
channel-lifetime=600

# --- what the relay refuses -------------------------------------------------------------------

# A TURN server with no peer restrictions is an open proxy into whatever private network it sits
# in — a well-known way to turn a media relay into an SSRF gadget. These denials are not optional.
no-multicast-peers
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=198.18.0.0-198.19.255.255
denied-peer-ip=::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff

# The cloud metadata endpoint. Reaching it through a relay is a credential-theft primitive on every
# major provider, and it is denied by the link-local range above — repeated explicitly because it is
# the one that actually gets exploited.
denied-peer-ip=169.254.169.254

# The relay must not be usable as a general-purpose proxy or a login target.
no-cli
no-tlsv1
no-tlsv1_1

# --- capacity ---------------------------------------------------------------------------------

# Per-allocation and total quotas, so one session cannot exhaust the PoP. 6 Mbps per session is the
# top of the degradation ladder plus headroom; total is sized for a modest relay.
user-quota=12
total-quota=1200
max-bps=800000

# --- TLS ---------------------------------------------------------------------------------------

cert=/etc/coturn/certs/fullchain.pem
pkey=/etc/coturn/certs/privkey.pem

# --- logging ------------------------------------------------------------------------------------

# To stdout, so the container runtime owns rotation. Verbose logging on a relay records who talked
# to whom, which is exactly the metadata docs/ARCHITECTURE.md §5.6 says not to retain.
log-file=stdout
no-stdout-log=false
simple-log
